name: Juice plan

# Builds the juice prep page the night before each juice day
# (Sunday night for Monday, Thursday night for Friday) and publishes it to GitHub Pages.
on:
  schedule:
    - cron: "17 3 * * 1,5"   # 9:17pm CST / 10:17pm CDT Sun & Thu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: juice-plan
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build plan from Square sales
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
        run: python3 juice-planner/planner.py --out site/juice/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}juice/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
